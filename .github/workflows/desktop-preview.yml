name: Desktop Preview Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            artifact: metis-desktop-macos
            bundles: app
            bundle: target/release/bundle
          - name: Windows
            os: windows-latest
            artifact: metis-desktop-windows
            bundles: nsis
            bundle: target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            artifact: metis-desktop-linux
            bundles: deb,appimage
            bundle: target/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test -p metis-desktop

      - name: Build desktop package
        working-directory: apps/desktop
        run: pnpm tauri build --bundles ${{ matrix.platform.bundles }}

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ${{ matrix.platform.bundle }}
          if-no-files-found: error

name: Desktop Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate desktop release version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate package versions and tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def workspace_version() -> str:
              contents = Path("Cargo.toml").read_text()
              section = re.search(
                  r"(?ms)^\[workspace\.package\]\s*(.*?)(?=^\[|\Z)",
                  contents,
              )
              if section is None:
                  raise SystemExit("Cargo.toml is missing [workspace.package]")
              version = re.search(
                  r'(?m)^version\s*=\s*"([^"]+)"\s*$',
                  section.group(1),
              )
              if version is None:
                  raise SystemExit("Cargo.toml is missing workspace.package.version")
              return version.group(1)

          versions = {
              "Cargo.toml": workspace_version(),
              "apps/desktop/package.json": json.loads(
                  Path("apps/desktop/package.json").read_text()
              )["version"],
              "apps/desktop/src-tauri/tauri.conf.json": json.loads(
                  Path("apps/desktop/src-tauri/tauri.conf.json").read_text()
              )["version"],
          }
          cargo_lock = Path("Cargo.lock").read_text()
          for package_name in (
              "metis-adapters",
              "metis-core",
              "metis-desktop",
              "metis-git-provider",
              "metis-security",
              "metis-storage",
          ):
              package = re.search(
                  rf'(?ms)^\[\[package\]\]\s*name = "{package_name}"\s*version = "([^"]+)"',
                  cargo_lock,
              )
              if package is None:
                  raise SystemExit(f"Cargo.lock is missing {package_name}")
              versions[f"Cargo.lock:{package_name}"] = package.group(1)
          if len(set(versions.values())) != 1:
              details = ", ".join(f"{path}={version}" for path, version in versions.items())
              raise SystemExit(f"Desktop package versions do not match: {details}")

          release_version = next(iter(versions.values()))
          semver = re.fullmatch(
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?",
              release_version,
          )
          if semver is None:
              raise SystemExit(f"Desktop version is not valid SemVer: {release_version}")
          prerelease = semver.group(4)
          if prerelease:
              for identifier in prerelease.split("."):
                  if identifier.isdigit() and len(identifier) > 1 and identifier.startswith("0"):
                      raise SystemExit(
                          f"Numeric prerelease identifier has a leading zero: {identifier}"
                      )

          if os.environ["REF_TYPE"] == "tag":
              ref_name = os.environ["REF_NAME"]
              prefix = "desktop-v"
              if not ref_name.startswith(prefix):
                  raise SystemExit(f"Desktop release tag must start with {prefix}: {ref_name}")
              tag_version = ref_name[len(prefix):]
              if tag_version != release_version:
                  raise SystemExit(
                      f"Tag version {tag_version} does not match package version {release_version}"
                  )

          print(f"Validated desktop release version {release_version}")
          PY

  build:
    name: Build ${{ matrix.platform.name }}
    needs: validate
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Universal
            os: macos-latest
            artifact: metis-desktop-macos-universal
            build_args: --target universal-apple-darwin --bundles dmg
            bundle: target/universal-apple-darwin/release/bundle
            updater_package: target/universal-apple-darwin/release/bundle/dmg/Metis_*_universal.dmg
          - name: Windows
            os: windows-latest
            artifact: metis-desktop-windows
            build_args: --bundles nsis
            bundle: target/release/bundle
            updater_package: target/release/bundle/nsis/Metis_*_x64-setup.exe
          - name: Linux
            os: ubuntu-22.04
            artifact: metis-desktop-linux
            build_args: --bundles deb,appimage
            bundle: target/release/bundle
            updater_package: target/release/bundle/appimage/Metis_*_amd64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux desktop dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install macOS universal Rust targets
        if: matrix.platform.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test -p metis-desktop

      - name: Build desktop package
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.platform.build_args }}

      - name: Sign updater package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          updater_packages=(${{ matrix.platform.updater_package }})
          if [[ "${#updater_packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one updater package for ${{ matrix.platform.name }}."
            find "${{ matrix.platform.bundle }}" -maxdepth 3 -type f -print
            exit 1
          fi
          pnpm --dir apps/desktop tauri signer sign "$GITHUB_WORKSPACE/${updater_packages[0]}"
          if [[ ! -s "${updater_packages[0]}.sig" ]]; then
            echo "Updater signature was not created: ${updater_packages[0]}.sig"
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 tools/software_update/validate_signature_key.py
          cargo test -p metis-desktop \
            ci_updater_signatures_verify_against_configured_public_key \
            -- --ignored

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'push' && matrix.platform.artifact || format('{0}-unsigned-preview', matrix.platform.artifact) }}
          path: ${{ matrix.platform.bundle }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create GitHub Release
    needs: [validate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download desktop packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-downloads

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find release-downloads -type f \( \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            artifact_dir="$(basename "$(dirname "$(dirname "$file")")")"
            parent_dir="$(basename "$(dirname "$file")")"
            base_name="$(basename "$file")"
            target_name="$base_name"
            if [[ -e "release-assets/$target_name" ]]; then
              target_name="${artifact_dir}-${parent_dir}-${base_name}"
            fi
            cp "$file" "release-assets/$target_name"
          done

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" -eq 0 ]]; then
            echo "No release assets were collected from workflow artifacts."
            exit 1
          fi

          release_version="${GITHUB_REF_NAME#desktop-v}"
          expected_assets=(
            "Metis_${release_version}_universal.dmg"
            "Metis_${release_version}_x64-setup.exe"
            "Metis_${release_version}_amd64.deb"
            "Metis_${release_version}_amd64.AppImage"
            "Metis_${release_version}_universal.dmg.sig"
            "Metis_${release_version}_x64-setup.exe.sig"
            "Metis_${release_version}_amd64.AppImage.sig"
          )
          for expected_asset in "${expected_assets[@]}"; do
            if [[ ! -f "release-assets/$expected_asset" ]]; then
              echo "Missing required release asset: $expected_asset"
              find release-assets -maxdepth 1 -type f -print
              exit 1
            fi
          done

          python3 tools/software_update/generate_latest_json.py

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 shasum -a 256 > SHA256SUMS
          )

          ls -la release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#desktop-v}"
          if [[ -z "$release_version" || "$release_version" == "$GITHUB_REF_NAME" ]]; then
            echo "Invalid desktop release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          release_assets=()
          while IFS= read -r -d '' asset; do
            release_assets+=("$asset")
          done < <(find release-assets -maxdepth 1 -type f ! -name latest.json -print0 | sort -z)
          if [[ "${#release_assets[@]}" -eq 0 ]]; then
            echo "No non-manifest release assets are available."
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=true
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --title "Metis ${release_version}" \
              --notes-file docs/release-notes/desktop.md \
              --draft \
              --verify-tag
          fi

      - name: Upload latest updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" release-assets/latest.json --clobber

      - name: Finalize GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#desktop-v}"
          if [[ -z "$release_version" || "$release_version" == "$GITHUB_REF_NAME" ]]; then
            echo "Invalid desktop release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          release_flags=(--prerelease=false --latest=false)
          version_without_build="${release_version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          else
            latest_tag="$(
              python3 - <<'PY'
          import json
          import os
          import subprocess

          response = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/latest"],
              capture_output=True,
              text=True,
              timeout=30,
          )
          try:
              payload = json.loads(response.stdout)
          except ValueError:
              raise SystemExit("Unable to determine the latest release: invalid API response.")
          if not isinstance(payload, dict):
              raise SystemExit("Unable to determine the latest release: unexpected API response.")
          if response.returncode:
              if str(payload.get("status")) != "404":
                  raise SystemExit("Unable to determine the latest release: GitHub API request failed.")
          else:
              tag = payload.get("tag_name")
              if not isinstance(tag, str) or not tag:
                  raise SystemExit("Unable to determine the latest release: missing tag name.")
              print(tag)
          PY
            )"
            if [[ -z "$latest_tag" ]]; then
              release_flags=(--prerelease=false --latest)
            elif [[ "$latest_tag" != desktop-v* ]]; then
              echo "Latest stable release has an unexpected tag: $latest_tag"
              exit 1
            else
              latest_version="${latest_tag#desktop-v}"
              if python3 - "$release_version" "$latest_version" <<'PY'
          import re
          import sys

          pattern = re.compile(
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
          )

          def stable_core(version: str) -> tuple[int, int, int]:
              match = pattern.fullmatch(version)
              if match is None or "-" in version.split("+", 1)[0]:
                  raise SystemExit(f"Expected stable SemVer: {version}")
              return tuple(int(match.group(index)) for index in range(1, 4))

          current_core = stable_core(sys.argv[1])
          latest_core = stable_core(sys.argv[2])
          raise SystemExit(0 if current_core >= latest_core else 1)
          PY
              then
                release_flags=(--prerelease=false --latest)
              else
                echo "Keeping newer stable release $latest_tag as GitHub latest."
              fi
            fi
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --title "Metis ${release_version}" \
            --notes-file docs/release-notes/desktop.md \
            --draft=false \
            "${release_flags[@]}"

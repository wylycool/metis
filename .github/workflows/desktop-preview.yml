name: Desktop Preview Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Universal
            os: macos-latest
            artifact: metis-desktop-macos-universal
            build_args: --target universal-apple-darwin --bundles dmg
            bundle: target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-latest
            artifact: metis-desktop-windows
            build_args: --bundles nsis
            bundle: target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            artifact: metis-desktop-linux
            build_args: --bundles deb,appimage
            bundle: target/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal Rust targets
        if: matrix.platform.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test -p metis-desktop

      - name: Build desktop package
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.platform.build_args }}

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ${{ matrix.platform.bundle }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download preview bundles
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find release-downloads -type f \( \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.deb" -o \
            -name "*.AppImage" \
          \) -print0 | while IFS= read -r -d '' file; do
            artifact_dir="$(basename "$(dirname "$(dirname "$file")")")"
            parent_dir="$(basename "$(dirname "$file")")"
            base_name="$(basename "$file")"
            target_name="$base_name"
            if [[ -e "release-assets/$target_name" ]]; then
              target_name="${artifact_dir}-${parent_dir}-${base_name}"
            fi
            cp "$file" "release-assets/$target_name"
          done

          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" -eq 0 ]]; then
            echo "No release assets were collected from workflow artifacts."
            exit 1
          fi

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 shasum -a 256 > SHA256SUMS
          )

          ls -la release-assets

      - name: Create or update prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "Metis ${GITHUB_REF_NAME}" \
              --notes-file docs/release-notes/desktop-beta.md \
              --prerelease \
              --verify-tag
          fi

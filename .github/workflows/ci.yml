name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      full_checks: ${{ steps.changes.outputs.full_checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Test change selection
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/github_release -p test_ci_changes.py

      - name: Check patch whitespace
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$CI_BASE_SHA" HEAD
          else
            echo "Baseline unavailable; full checks required."
          fi

      - name: Classify changed paths
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/github_release/ci_changes.py

  rust:
    name: Rust checks
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.full_checks != 'false') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Require successful change classification
        if: cancelled() || needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Validate Workflow security
        run: |
          python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2 tomli==2.0.1
          PYTHONDONTWRITEBYTECODE=1 python3 tools/github_release/validate_release_workflow.py

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  windows-rust:
    name: Windows Rust tests
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.full_checks != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Require successful change classification
        if: cancelled() || needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Run Windows Rust tests
        run: cargo test -p metis-desktop

  desktop:
    name: Desktop checks
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.full_checks != 'false') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Require successful change classification
        if: cancelled() || needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        working-directory: apps/desktop
        run: pnpm test:e2e

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: pnpm build

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metis Git 检测失败态预览</title>
    <style>
      :root {
        color: #102033;
        background: #eef4fb;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, rgba(248, 251, 255, 0.92), rgba(238, 244, 251, 0.96)),
          #eef4fb;
      }

      .preview-shell {
        width: min(1120px, calc(100vw - 48px));
        margin: 0 auto;
        padding: 42px 0;
      }

      .preview-heading {
        display: grid;
        gap: 8px;
        margin-bottom: 20px;
      }

      .preview-heading span {
        color: #2563eb;
        font-size: 12px;
        font-weight: 850;
      }

      h1 {
        margin: 0;
        color: #0f172a;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .settings-panel {
        display: grid;
        gap: 14px;
        border: 1px solid #dbe7f5;
        border-radius: 14px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 52px rgba(15, 23, 42, 0.08);
      }

      .settings-section {
        display: grid;
        grid-template-rows: auto auto;
        gap: 8px;
        min-height: auto;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px 14px;
        background: #ffffff;
      }

      .settings-section h2 {
        margin: 0;
        color: #1e293b;
        font-size: 14px;
        font-weight: 850;
        letter-spacing: 0;
      }

      .settings-git-health-card {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 16px;
        border: 0;
        border-radius: 0;
        padding: 0;
        background: transparent;
      }

      .settings-git-test-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        min-width: 76px;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        padding: 0 14px;
        color: #ffffff;
        background: #2563eb;
        font-size: 13px;
        font-weight: 750;
        white-space: nowrap;
        box-shadow: none;
        cursor: default;
      }

      .settings-git-test-button:hover {
        border-color: #93c5fd;
        color: #1d4ed8;
        background: #eff6ff;
        box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.28);
      }

      .settings-git-health-notice {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        min-height: 32px;
        border: 1px solid #fed7aa;
        border-radius: 8px;
        padding: 6px 10px;
        color: #9a3412;
        background: #fff7ed;
        font-size: 12px;
        font-weight: 750;
        line-height: 1.45;
      }

      .settings-git-health-notice span {
        overflow-wrap: anywhere;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .preview-card {
        display: grid;
        gap: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 14px;
        background: #f8fafc;
      }

      .preview-card strong {
        color: #334155;
        font-size: 13px;
        font-weight: 850;
      }

      @media (max-width: 760px) {
        .preview-shell {
          width: min(100% - 28px, 1120px);
          padding: 24px 0;
        }

        .preview-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <header class="preview-heading">
        <span>Metis Settings Preview</span>
        <h1>本机Git 检测失败态</h1>
      </header>

      <section class="settings-panel" aria-label="Git 检测失败态预览">
        <div class="preview-grid">
          <article class="preview-card">
            <strong>场景 1</strong>
            <section class="settings-section">
              <h2>本机Git 检测</h2>
              <div class="settings-git-health-card">
                <button class="settings-git-test-button" type="button">检测</button>
                <div class="settings-git-health-notice" role="status">
                  <span>本机未安装Git</span>
                </div>
              </div>
            </section>
          </article>

          <article class="preview-card">
            <strong>场景 2</strong>
            <section class="settings-section">
              <h2>本机Git 检测</h2>
              <div class="settings-git-health-card">
                <button class="settings-git-test-button" type="button">检测</button>
                <div class="settings-git-health-notice" role="status">
                  <span>Git 可启动，但本地 clone/fetch 命令自检失败，请自行确认</span>
                </div>
              </div>
            </section>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
